        .Arcade {
            font-family: 'Luckiest Guy', 'luckiest guy', sans-serif;
            font-size: 2.3rem;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: #f9f2ff;
            text-shadow: 0 0 12px rgba(77, 231, 255, 0.28);
            position: relative;
            display: inline-block;
            animation: cyberPulse 1.4s ease-in-out infinite, cyberShift 1.8s linear infinite;
        }

        .Arcade::before,
        .Arcade::after {
            content: attr(data-text);
            position: absolute;
            inset: 0;
            pointer-events: none;
            opacity: 0.75;
        }

        .Arcade::before {
            color: #ff2fdc;
            transform: translate(2px, 0);
            animation: cyberGlitchA 0.9s infinite linear alternate-reverse;
            z-index: 1;
        }

        .Arcade::after {
            color: #00f7ff;
            transform: translate(-2px, 0);
            animation: cyberGlitchB 1.1s infinite linear alternate;
            z-index: 0;
        }

        @keyframes cyberPulse {
            0%, 100% { transform: scale(1); text-shadow: 0 0 10px rgba(77, 231, 255, 0.35); }
            50% { transform: scale(1.03); text-shadow: 0 0 22px rgba(255, 47, 220, 0.6), 0 0 30px rgba(0, 247, 255, 0.35); }
        }

        @keyframes cyberShift {
            0%, 100% { letter-spacing: 0.22em; }
            50% { letter-spacing: 0.28em; }
        }

        @keyframes cyberGlitchA {
            0% { clip-path: inset(0 0 85% 0); transform: translate(1px, 0); }
            20% { clip-path: inset(10% 0 60% 0); transform: translate(-1px, 0); }
            40% { clip-path: inset(30% 0 30% 0); transform: translate(2px, 0); }
            60% { clip-path: inset(60% 0 10% 0); transform: translate(-2px, 0); }
            80% { clip-path: inset(20% 0 70% 0); transform: translate(1px, 0); }
            100% { clip-path: inset(75% 0 0 0); transform: translate(0, 0); }
        }

        @keyframes cyberGlitchB {
            0% { clip-path: inset(70% 0 10% 0); transform: translate(-1px, 0); }
            25% { clip-path: inset(20% 0 65% 0); transform: translate(1px, 0); }
            50% { clip-path: inset(5% 0 80% 0); transform: translate(2px, 0); }
            75% { clip-path: inset(40% 0 35% 0); transform: translate(-2px, 0); }
            100% { clip-path: inset(85% 0 0 0); transform: translate(0, 0); }
        }

        .comic-brutal-button-container {
            --primary-color: #8516B5;
            --secondary-color: #F20069;
            --text-color: #F20069;
            --accent-color: #00F2F2;
            --panel-color: #00F2F2;
            --shadow-color: rgba(0, 0, 0, 0.75);

            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.2em 0;
            width: fit-content;
        }

        .comic-brutal-button {
            position: relative;
            font-size: 1.2em;
            border: none;
            background: none;
            cursor: pointer;
            padding: 0;
            display: inline-block;
            text-decoration: none;
            transform: rotate(-2deg);
            transform-origin: center;
            transition: transform 0.15s cubic-bezier(0.22, 0.61, 0.36, 1);
        }

        .comic-brutal-button .button-inner {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: var(--primary-color);
            color: var(--text-color);
            padding: 0.55em 1em;
            z-index: 3;
            overflow: hidden;
            transform: skew(-3deg, 1deg);
            transition: transform 0.15s cubic-bezier(0.22, 0.61, 0.36, 1);
            clip-path: polygon(
                0% 10%,
                3% 0%,
                97% 0%,
                100% 10%,
                100% 90%,
                97% 100%,
                3% 100%,
                0% 90%
            );
        }

        .comic-brutal-button .button-text {
            position: relative;
            font-weight: 900;
            font-size: 1.05em;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            z-index: 5;
            color: var(--text-color);
            text-shadow:
                0.05em 0.05em 0 var(--panel-color),
                -0.05em -0.05em 0 var(--panel-color),
                0.05em -0.05em 0 var(--panel-color),
                -0.05em 0.05em 0 var(--panel-color);
            transform: rotate(2deg);
        }

        .comic-brutal-button .button-frame {
            position: absolute;
            top: -0.3em;
            left: -0.3em;
            right: -0.3em;
            bottom: -0.3em;
            background-color: var(--accent-color);
            border: 0.15em solid var(--text-color);
            z-index: 1;
            transition: transform 0.15s cubic-bezier(0.22, 0.61, 0.36, 1);
        }

        .comic-brutal-button .button-shadow {
            position: absolute;
            top: 0.4em;
            left: 0.4em;
            right: -0.4em;
            bottom: -0.4em;
            background-color: var(--shadow-color);
            z-index: 0;
            transition: all 0.15s cubic-bezier(0.22, 0.61, 0.36, 1);
        }

        .comic-brutal-button .halftone-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(
                circle at 30% 30%,
                rgba(0, 0, 0, 0.2) 0.1em,
                transparent 0.1em
            );
            background-size: 0.5em 0.5em;
            background-position: 0 0;
            opacity: 0.3;
            z-index: 2;
            mix-blend-mode: multiply;
        }

        .comic-brutal-button .ink-splatter {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            opacity: 0;
            transition: opacity 0.2s ease;
            background: radial-gradient(
                    circle at 20% 30%,
                    rgba(0, 0, 0, 0.15) 0%,
                    rgba(0, 0, 0, 0.08) 20%,
                    transparent 50%
                ),
                radial-gradient(
                    circle at 70% 65%,
                    rgba(0, 0, 0, 0.15) 0%,
                    rgba(0, 0, 0, 0.08) 25%,
                    transparent 50%
                ),
                radial-gradient(
                    circle at 40% 50%,
                    rgba(0, 0, 0, 0.15) 0%,
                    rgba(0, 0, 0, 0.08) 30%,
                    transparent 60%
                ),
                radial-gradient(
                    circle at 85% 15%,
                    rgba(0, 0, 0, 0.15) 0%,
                    rgba(0, 0, 0, 0.08) 15%,
                    transparent 40%
                );
        }

        .comic-brutal-button:hover {
            transform: rotate(-1deg) scale(1.05);
        }

        .comic-brutal-button:hover .button-inner {
            transform: skew(-5deg, 2deg);
            background-color: var(--secondary-color);
        }

        .comic-brutal-button:hover .button-text {
            color: var(--panel-color);
            text-shadow:
                0.05em 0.05em 0 var(--text-color),
                -0.05em -0.05em 0 var(--text-color),
                0.05em -0.05em 0 var(--text-color),
                -0.05em 0.05em 0 var(--text-color);
        }

        .comic-brutal-button:hover .button-shadow {
            transform: translate(0.2em, 0.2em);
        }

        .comic-brutal-button:hover .ink-splatter {
            opacity: 1;
        }

        .comic-brutal-button:focus {
            outline: none;
        }

        .comic-brutal-button:focus .button-frame {
            border-color: var(--secondary-color);
        }

        .comic-brutal-button:active {
            transform: rotate(0) scale(0.98);
        }

        .comic-brutal-button:active .button-inner {
            transform: skew(0, 0);
        }

        .comic-brutal-button:active .button-shadow {
            transform: translate(0.1em, 0.1em);
        }

        @keyframes brutalBurst {
            0% { transform: scale(0.95); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .comic-brutal-button:active .button-text {
            animation: brutalBurst 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes brutalDash {
            to { stroke-dashoffset: -20; }
        }

        .comic-brutal-button:focus::after {
            content: "";
            position: absolute;
            top: -0.5em;
            left: -0.5em;
            right: -0.5em;
            bottom: -0.5em;
            border: 0.15em dashed var(--text-color);
            z-index: 0;
            animation: brutalDash 1s linear infinite;
            pointer-events: none;
        }

        .comic-brutal-button::before {
            content: "";
            position: absolute;
            top: 0.4em;
            left: 0.8em;
            width: 1em;
            height: 1em;
            background-color: var(--accent-color);
            border-radius: 50%;
            z-index: 2;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .comic-brutal-button:hover::before {
            opacity: 0.7;
        }

        @keyframes brutalActionLines {
            0% { opacity: 0; transform: scale(0.7); }
            50% { opacity: 1; }
            100% { opacity: 0; transform: scale(1.2); }
        }

        .comic-brutal-button:active::before {
            content: "";
            position: absolute;
            top: -1em;
            left: -1em;
            right: -1em;
            bottom: -1em;
            background-image: radial-gradient(var(--text-color) 0%, transparent 70%),
                repeating-conic-gradient(
                    transparent 0%,
                    transparent 5%,
                    var(--text-color) 5%,
                    var(--text-color) 6%
                );
            opacity: 0;
            z-index: 6;
            mix-blend-mode: overlay;
            pointer-events: none;
            animation: brutalActionLines 0.5s ease-out forwards;
        }

        .menu-actions-brutal-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 72px;
        }

    </style>

<body>
    <audio id="bgMusic" src="Game_song_Loop_.mp3" loop preload="auto"></audio>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            var bgMusic = document.getElementById('bgMusic');
            if (!bgMusic) return;
            bgMusic.volume = 0.5;

            var events = ['click', 'keydown', 'touchstart'];

            function stopListening() {
                events.forEach(function (evt) {
                    document.removeEventListener(evt, unlockOnGesture);
                });
            }

            function startMusic() {
                var playPromise = bgMusic.play();
                if (playPromise && typeof playPromise.then === 'function') {
                    playPromise.then(stopListening).catch(function (err) {
                        console.warn('QuBeat: background music blocked, waiting for interaction.', err);
                    });
                }
            }

            function unlockOnGesture() {
                startMusic();
            }

            startMusic();
            events.forEach(function (evt) {
                document.addEventListener(evt, unlockOnGesture);
            });
        });
    </script>

        <script src="Qubeat.js"></script>
        <audio id="mainMenuSfx" src="musics/main_menu.mp3" preload="auto"></audio>
        <audio id="modePickSfx" src="musics/modepick.mp3" preload="auto"></audio>
        <audio id="modeSelectSfx" src="musics/LogicArcade.mp3" preload="auto"></audio>
        <audio id="continueSfx" src="musics/starting.mp3" preload="auto"></audio>
        <script>
            document.addEventListener('DOMContentLoaded', function () {
                var modePickSfx = document.getElementById('modePickSfx');
                var modeSelectSfx = document.getElementById('modeSelectSfx');

                var modeInputs = document.querySelectorAll('input[name="btn"]');
                modeInputs.forEach(function (input) {
                    input.addEventListener('change', function () {
                        if (modeSelectSfx) {
                            modeSelectSfx.currentTime = 0;
                            modeSelectSfx.play().catch(function (err) {
                                console.warn('QuBeat: mode select sound could not play.', err, 'src:', modeSelectSfx.currentSrc);
                            });
                        }
                    });
                });

                // Delegated fallback in case Qubeat.js re-renders these elements
                // or intercepts the native change event.
                document.addEventListener('click', function (e) {
                    var label = e.target.closest('label.mode-button');
                    if (label && modeSelectSfx) {
                        modeSelectSfx.currentTime = 0;
                        modeSelectSfx.play().catch(function (err) {
                            console.warn('QuBeat: mode select sound could not play (delegated).', err, 'src:', modeSelectSfx.currentSrc);
                        });
                    }
                });

                var pacingInputs = document.querySelectorAll('input[name="co-op-choice"], input[name="arcade-choice"]');
                pacingInputs.forEach(function (input) {
                    input.addEventListener('change', function () {
                        if (modePickSfx) {
                            modePickSfx.currentTime = 0;
                            modePickSfx.play().catch(function () {});
                        }
                    });
                });

                var mainMenuBtn = document.getElementById('mainMenuBtn');
                var mainMenuSfx = document.getElementById('mainMenuSfx');
                if (mainMenuBtn) {
                    mainMenuBtn.addEventListener('click', function (e) {
                        e.preventDefault();
                        var target = mainMenuBtn.getAttribute('href');
                        if (mainMenuSfx) {
                            mainMenuSfx.currentTime = 0;
                            mainMenuSfx.play().catch(function () {});
                        }
                        setTimeout(function () {
                            window.location.href = target;
                        }, 150);
                    });
                }
            });
        </script>
        <script>
            // Keep the Continue link in sync with selected mode and pacing
            (function(){
                const continueLink = document.getElementById('continueToLanguage');
                const modeInputs = document.querySelectorAll('input[name="btn"]');
                const coOpGroup = document.querySelectorAll('input[name="co-op-choice"]');
                const arcadeGroup = document.querySelectorAll('input[name="arcade-choice"]');

                function slugify(text){
                    return String(text || '').toLowerCase().replace(/\s+/g,'-').replace(/[^a-z0-9-]/g,'');
                }

                function getSelectedMode(){
                    const checked = Array.from(modeInputs).find(i => i.checked) || modeInputs[0];
                    if(!checked) return 'arcade';
                    const label = document.querySelector(`label[for="${checked.id}"]`);
                    if(!label) return 'arcade';
                    const modeText = (label.dataset.mode || label.textContent || '').toLowerCase();
                    // Normalize tokens: Logic Duel => coop, Arcade => arcade
                    if(modeText.includes('logic') || modeText.includes('duel') || modeText.includes('coop')) return 'coop';
                    return 'arcade';
                }

                function getSelectedPacing(){
                    // Read pacing from whichever group matches the CURRENTLY SELECTED mode.
                    // (Both radio groups always keep their own "checked" default even when
                    // hidden, since they are separate <input name="..."> groups — so we must
                    // pick the group based on mode instead of "coop if present".)
                    const mode = getSelectedMode();
                    const group = (mode === 'coop') ? coOpGroup : arcadeGroup;
                    const picked = Array.from(group).find(i => i.checked);
                    if(picked){
                        const span = picked.closest('label')?.querySelector('.label-text');
                        if(span) return slugify(span.textContent);
                    }
                    return mode === 'coop' ? 'whole-note' : 'turtle';
                }

                function updateHref(){
                    const mode = getSelectedMode();
                    const pacing = getSelectedPacing();
                    continueLink.href = `QubeatLanguage.html?mode=${encodeURIComponent(mode)}&pacing=${encodeURIComponent(pacing)}`;
                }

                // initialize and watch for changes
                updateHref();
                document.addEventListener('change', updateHref);

                // Ensure href is correct at click time; store selection as fallback
                continueLink.addEventListener('click', function(e){
                    e.preventDefault();
                    const mode = getSelectedMode();
                    const pacing = getSelectedPacing();
                    try{
                        localStorage.setItem('qubeat.mode', mode);
                        localStorage.setItem('qubeat.pacing', pacing);
                    }catch(err){ /* ignore storage errors */ }
                    const href = `QubeatLanguage.html?mode=${encodeURIComponent(mode)}&pacing=${encodeURIComponent(pacing)}`;
                    const continueSfx = document.getElementById('continueSfx');
                    if (continueSfx) {
                        continueSfx.currentTime = 0;
                        continueSfx.play().catch(function () {});
                    }
                    setTimeout(function () {
                        window.location.href = href;
                    }, 1000);
                });
            })();
        </script>
</body>
