<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QuBeat — Results</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira:wght@400;600;700;800&family=Russo+One&family=VT323&family=Protest+Revolution&family=Luckiest+Guy&family=Bitcount+Grid+Double&family=Caveat:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --pink:#ff4db6;
    --pink-hot:#ff2ca4;
    --violet:#c500ff;
    --gold:#fac921;
    --ink:#ffd8f2;
  }
  *{ box-sizing:border-box; }
  html,body{
    height:100%; margin:0; padding:0; overflow:hidden;
    font-family:'Saira', sans-serif;
    color:var(--ink);
  }
  body{
  background-image: url(background.gif);
   background-size: cover;
   background-position: center;
   background-repeat: no-repeat;
    display:flex; align-items:center; justify-content:center;
  }

  .results-shell{
    width:min(92%, 760px);
    background:linear-gradient(180deg, #150819 0%, #1d0a28 60%, #0a0410 100%);
    border:1px solid rgba(255, 98, 214, 0.24);
    border-radius:28px;
    box-shadow:
      0 24px 72px rgba(0,0,0,0.55),
      inset 0 0 0 1px rgba(255, 98, 214, 0.08),
      inset 0 0 40px rgba(255, 42, 172, 0.08);
    padding:clamp(24px, 4vw, 44px);
    text-align:center;
    position:relative;
    overflow:hidden;
  }
  .results-shell::after{
    content:"";
    position:absolute; inset:-10px; border-radius:34px;
    pointer-events:none;
    box-shadow: 0 0 0 6px rgba(0, 0, 0, 0.9), 0 0 46px rgba(255, 98, 214, 0.1);
  }

  .eyebrow{
    font-family:'Luckiest Guy', sans-serif;
    letter-spacing:0.3em;
    font-size:0.8rem;
    color:rgba(255, 216, 242, 0.55);
    margin:0 0 6px;
    text-transform:uppercase;
  }

  .winner-banner{
    font-family:'Bitcount Grid Double', sans-serif;
    font-size:clamp(2rem, 6vw, 3.2rem);
    line-height:1.15;
    margin:0 0 6px;
    background:linear-gradient(90deg, var(--pink-hot), var(--violet));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    text-shadow:0 0 46px rgba(255,44,164,0.35);
  }
  .winner-banner.tie{
    background:linear-gradient(90deg, #d9a8ff, #ff9adf);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }

  .reason-line{
    font-family:'Protest Revolution', sans-serif;
    font-size:0.95rem;
    color:rgba(255, 216, 242, 0.65);
    margin:0 0 30px;
    letter-spacing:0.04em;
  }
 
  .hp-duel{
    display:flex; align-items:stretch; gap:10px;
    margin-bottom:10px;
  }
  .hp-side{
    flex:1; display:flex; flex-direction:column; gap:8px; align-items:center;
  }
  .hp-name{
    font-family:'Caveat', cursive;
    font-weight:700;
    font-size:1.1rem;
    letter-spacing:0.06em;
  }
  .hp-side.p1 .hp-name{ color:var(--pink); text-shadow:0 0 12px rgba(255,77,182,0.6); }
  .hp-side.p2 .hp-name{ color:var(--violet); text-shadow:0 0 12px rgba(197,0,255,0.6); }
  .hp-track{
    position:relative;
    height:26px;
    width:100%;
    border-radius:999px;
    background:rgba(255,255,255,0.05);
    border:2px solid rgba(255, 98, 214, 0.2);
    box-shadow:inset 0 0 14px rgba(255, 77, 177, 0.12);
    overflow:hidden;
  }
  .hp-side.p1 .hp-track{
    border-color:#7DF9FF;
    animation:trackGlowCyan 1.8s ease-in-out infinite;
  }
  .hp-side.p2 .hp-track{
    border-color:var(--gold);
    animation:trackGlowYellow 1.8s ease-in-out infinite;
  }
  @keyframes trackGlowCyan{
    0%,100%{ box-shadow: inset 0 0 14px rgba(125,249,255,0.25), 0 0 12px rgba(125,249,255,0.5); }
    50%    { box-shadow: inset 0 0 20px rgba(125,249,255,0.4), 0 0 26px rgba(125,249,255,0.9); }
  }
  @keyframes trackGlowYellow{
    0%,100%{ box-shadow: inset 0 0 14px rgba(250,201,33,0.25), 0 0 12px rgba(250,201,33,0.5); }
    50%    { box-shadow: inset 0 0 20px rgba(250,201,33,0.4), 0 0 26px rgba(250,201,33,0.9); }
  }
  .hp-fill{
    position:absolute; top:0; bottom:0;
    transition:width 0.9s cubic-bezier(0.22,1,0.36,1);
    width:0%;
  }
  .hp-side.p1 .hp-fill{ left:0; background:linear-gradient(90deg, rgba(255,77,182,0.3), var(--pink)); border-radius:999px 0 0 999px; box-shadow:0 0 18px rgba(255,77,177,0.6); }
  .hp-side.p2 .hp-fill{ right:0; background:linear-gradient(90deg, var(--violet), rgba(197,0,255,0.35)); border-radius:0 999px 999px 0; box-shadow:0 0 18px rgba(197,0,255,0.6); }
  .hp-value{
    font-family:'Russo One', sans-serif;
    font-size:1.1rem;
    text-shadow:0 0 14px rgba(255,126,229,0.3);
  }
  .hp-side.p2 .hp-value{ color:var(--gold); text-shadow:0 0 14px rgba(250,201,33,0.5); }

  .vs-badge{
    align-self:center;
    font-family:'Russo One', sans-serif;
    font-size:0.75rem;
    letter-spacing:0.15em;
    color:rgba(255, 216, 242, 0.45);
    padding-top:2px;
  }

  .actions{
    margin-top:34px;
    display:flex; flex-wrap:wrap; gap:48px; justify-content:center;
  }

   
  [class*="btn-glitch-"]{
    display:inline-block;
    font-family:"VT323", monospace;
    font-size:1.1rem;
    border:1px solid var(--ink);
    color:var(--ink);
    background:rgba(21, 6, 45, 0.9);
    padding:10px 13px;
    min-width:175px;
    line-height:1.5em;
    white-space:nowrap;
    text-transform:uppercase;
    cursor:pointer;
    border-radius:15px;
    text-decoration:none;
    text-align:left;
  }
  [class*="btn-glitch-"] .text,
  [class*="btn-glitch-"] .decoration{ display:inline-block; }
  [class*="btn-glitch-"] .decoration{ float:right; }
  [class*="btn-glitch-"]:hover,
  [class*="btn-glitch-"]:focus{
    animation-name: glitch;
    animation-duration: 0.2s;
    background-color: var(--pink-hot);
    color: black;
    border: 1px solid var(--pink-hot);
  }
  [class*="btn-glitch-"]:hover .text-decoration,
  [class*="btn-glitch-"]:focus .text-decoration,
  [class*="btn-glitch-"]:hover .decoration,
  [class*="btn-glitch-"]:focus .decoration{
    animation-name: blink;
    animation-duration: 0.1s;
    animation-iteration-count: infinite;
  }
  [class*="btn-glitch-"]:active{
    background:none;
    color: var(--pink-hot);
  }
  [class*="btn-glitch-"]:active .text-decoration,
  [class*="btn-glitch-"]:active .decoration{ animation-name:none; }
  [class*="btn-glitch-"]:active::before,
  [class*="btn-glitch-"]:active::after{ display:none; }

  @keyframes glitch{
    25% { background-color: red; transform: translateX(-10px); letter-spacing: 10px; }
    35% { background-color: green; transform: translate(10px); }
    59% { opacity: 0; }
    60% { background-color: blue; transform: translate(-10px); filter: blur(5px); }
    100% { background-color: var(--pink-hot); }
  }
  @keyframes blink{ 50% { opacity: 0; } }
</style>
</head>
<body>
  <audio id="p1WinSfx" src="musics/Player_1_win.mp3"></audio>
  <audio id="p2WinSfx" src="musics/Player_2_win.mp3"></audio>
  <audio id="playAgainSfx" src="musics/starting.mp3"></audio>
  <audio id="gameOverScreenSfx" src="musics/Game_Over_Screen.mp3"></audio>
  <audio id="gameOverVoiceSfx" src="musics/Game_Over_voice.mp3"></audio>

  <div class="results-shell">
    <p class="eyebrow">Match Complete</p>
    <h1 id="winnerBanner" class="winner-banner">Loading…</h1>
    <p id="reasonLine" class="reason-line"></p>

    <div class="hp-duel">
      <div class="hp-side p1">
        <span class="hp-name">Player 1</span>
        <div class="hp-track"><div id="p1Fill" class="hp-fill"></div></div>
        <span id="p1Value" class="hp-value">0%</span>
      </div>
      <span class="vs-badge">VS</span>
      <div class="hp-side p2">
        <span id="p2Name" class="hp-name">Player 2</span>
        <div class="hp-track"><div id="p2Fill" class="hp-fill"></div></div>
        <span id="p2Value" class="hp-value">0%</span>
      </div>
    </div>

    <div class="actions">
      <a id="playAgainBtn" class="btn-glitch-fill" href="QubeatGameStart.html">
        <span class="text">Play Again</span><span class="text-decoration"> _</span><span class="decoration">⇒</span>
      </a>
      <a id="mainMenuBtn" class="btn-glitch-fill" href="QuBeatMenu.html">
        <span class="text">Main Menu</span><span class="text-decoration"> _</span><span class="decoration">⇒</span>
      </a>
    </div>
  </div>

  <script>
    (function(){
      const params = new URLSearchParams(window.location.search);
      const hp1 = Math.max(0, Math.min(100, parseInt(params.get('hp1'), 10) || 0));
      const hp2 = Math.max(0, Math.min(100, parseInt(params.get('hp2'), 10) || 0));
      const reason = params.get('reason') || 'time';
      const mode = params.get('mode') || '';
      const pacing = params.get('pacing') || '';
      const diff = params.get('diff') || '';
      const lang = params.get('lang') || '';

      const winnerBanner = document.getElementById('winnerBanner');
      const reasonLine = document.getElementById('reasonLine');
      const p1Fill = document.getElementById('p1Fill');
      const p2Fill = document.getElementById('p2Fill');
      const p1Value = document.getElementById('p1Value');
      const p2Value = document.getElementById('p2Value');
      const p2Name = document.getElementById('p2Name');

      // Game over screen sound + voice line play together as soon as results load —
      // the screen sound sits quiet in the background, the voice is a bit louder on top.
      const gameOverScreenSfx = document.getElementById('gameOverScreenSfx');
      const gameOverVoiceSfx = document.getElementById('gameOverVoiceSfx');
      if (gameOverScreenSfx) gameOverScreenSfx.addEventListener('error', () => console.warn('gameOverScreenSfx failed to load — check the file path:', gameOverScreenSfx.src));
      if (gameOverVoiceSfx) gameOverVoiceSfx.addEventListener('error', () => console.warn('gameOverVoiceSfx failed to load — check the file path:', gameOverVoiceSfx.src));

      function playGameOverAudio() {
        if (gameOverScreenSfx) {
          gameOverScreenSfx.volume = 0.35;
          gameOverScreenSfx.currentTime = 0;
        }
        if (gameOverVoiceSfx) {
          gameOverVoiceSfx.volume = 0.85;
          gameOverVoiceSfx.currentTime = 0;
        }
        const p1 = gameOverScreenSfx ? gameOverScreenSfx.play() : Promise.resolve();
        const p2 = gameOverVoiceSfx ? gameOverVoiceSfx.play() : Promise.resolve();
        Promise.all([p1, p2].map(p => p && p.catch ? p.catch(() => 'blocked') : p)).then((results) => {
          // If the browser blocked autoplay, retry as soon as the user interacts with the page.
          if (results.includes('blocked')) {
            const retry = () => {
              if (gameOverScreenSfx) { gameOverScreenSfx.currentTime = 0; gameOverScreenSfx.play().catch(() => {}); }
              if (gameOverVoiceSfx) { gameOverVoiceSfx.currentTime = 0; gameOverVoiceSfx.play().catch(() => {}); }
              document.removeEventListener('click', retry);
              document.removeEventListener('keydown', retry);
              document.removeEventListener('touchstart', retry);
            };
            document.addEventListener('click', retry, { once: true });
            document.addEventListener('keydown', retry, { once: true });
            document.addEventListener('touchstart', retry, { once: true });
          }
        });
      }
      playGameOverAudio();

      // In Arcade mode Player 2 was the NPC — carry that naming through to the results screen.
      const player2Label = (mode === 'arcade') ? 'NPC' : 'Player 2';
      if (p2Name) p2Name.textContent = player2Label;

      // Winner is decided purely by final HP: higher HP wins, equal HP is a tie —
      // this covers both an elimination finish and a time's-up finish the same way.
      let bannerText, bannerClass = '';
      const p1WinSfx = document.getElementById('p1WinSfx');
      const p2WinSfx = document.getElementById('p2WinSfx');
      if (hp1 === hp2) { bannerText = "IT'S A TIE!"; bannerClass = 'tie'; }
      else if (hp1 > hp2) { bannerText = 'PLAYER 1 WINS!'; if (p1WinSfx) { p1WinSfx.currentTime = 0; p1WinSfx.play().catch(()=>{}); } }
      else { bannerText = `${player2Label.toUpperCase()} WINS!`; if (p2WinSfx) { p2WinSfx.currentTime = 0; p2WinSfx.play().catch(()=>{}); } }
      winnerBanner.textContent = bannerText;
      if (bannerClass) winnerBanner.classList.add(bannerClass);

      reasonLine.textContent = reason === 'elimination'
        ? 'Match ended when a player\u2019s HP hit zero.'
        : reason === 'questions-exhausted'
          ? 'No questions left \u2014 the higher HP wins the round.'
          : 'Time ran out \u2014 the higher HP wins the round.';

      p1Value.textContent = hp1 + '%';
      p2Value.textContent = hp2 + '%';
      requestAnimationFrame(() => {
        p1Fill.style.width = hp1 + '%';
        p2Fill.style.width = hp2 + '%';
      });

      // Carry the run's settings forward so replay/change-setup links land in the right place
      const runParams = new URLSearchParams();
      if (mode) runParams.set('mode', mode);
      if (pacing) runParams.set('pacing', pacing);
      if (diff) runParams.set('diff', diff);
      if (lang) runParams.set('lang', lang);
      const runQuery = runParams.toString();

      const playAgainBtn = document.getElementById('playAgainBtn');
      const playAgainHref = 'QubeatGameStart.html' + (runQuery ? '?' + runQuery : '');
      if (playAgainBtn) playAgainBtn.href = playAgainHref;

      // Play Again gets the start-button sting, same one used to launch a match from the menu.
      // The link normally navigates the instant it's clicked, which cuts the sting off before
      // it's audible — so we hold the navigation just long enough for the sound to be heard.
      const playAgainSfx = document.getElementById('playAgainSfx');
      const NAV_DELAY_MS = 250;
      if (playAgainBtn) {
        playAgainBtn.addEventListener('click', (e) => {
          e.preventDefault();
          if (playAgainSfx) {
            playAgainSfx.currentTime = 0;
            playAgainSfx.play().catch(() => {});
          }
          setTimeout(() => { window.location.href = playAgainHref; }, NAV_DELAY_MS);
        });
      }

      // Main Menu gets the main_menu.mp3 sting — same navigation-delay fix.
      const mainMenuBtn = document.getElementById('mainMenuBtn');
      if (mainMenuBtn) {
        const mainMenuHref = mainMenuBtn.getAttribute('href');
        mainMenuBtn.addEventListener('click', (e) => {
          e.preventDefault();
          try { new Audio('musics/main_menu.mp3').play().catch(() => {}); } catch (err) {}
          setTimeout(() => { window.location.href = mainMenuHref; }, NAV_DELAY_MS);
        });
      }
    })();
  </script>
</body>
</html>
